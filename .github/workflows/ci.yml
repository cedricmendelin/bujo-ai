name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test completion declaration gate
        run: node --test .github/scripts/*.test.js

      - name: Detect project types
        id: detect
        shell: bash
        run: |
          shopt -s globstar nullglob
          dotnet_files=(**/*.sln **/*.slnx **/*.csproj)
          tf_files=(infra/**/*.tf)
          echo "dotnet=$([ ${#dotnet_files[@]} -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "terraform=$([ ${#tf_files[@]} -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        if: steps.detect.outputs.dotnet == 'true'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Build and test
        if: steps.detect.outputs.dotnet == 'true'
        run: |
          dotnet restore
          dotnet build --no-restore --configuration Release
          dotnet test --no-build --configuration Release --verbosity normal

      - name: Set up Terraform
        if: steps.detect.outputs.terraform == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Terraform fmt and validate
        if: steps.detect.outputs.terraform == 'true'
        working-directory: infra
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

      - name: Nothing to build yet
        if: steps.detect.outputs.dotnet != 'true' && steps.detect.outputs.terraform != 'true'
        run: echo "No .NET or Terraform sources yet; CI passes."

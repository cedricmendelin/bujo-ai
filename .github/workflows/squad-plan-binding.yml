name: Squad Plan Binding

on:
  issue_comment:
    types: [created, edited, deleted]
  issues:
    types: [labeled, unlabeled]
  workflow_run:
    workflows: [Squad Plan, Squad Plan Approved]
    types: [completed]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A single repository-wide lock serializes approval, invalidation, and sweep
  # writes. This is intentionally stronger than per-issue serialization.
  group: squad-plan-${{ github.repository }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'plan:waived'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: read
      checks: write
      actions: write
    steps:
      - name: Checkout trusted default-branch modules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Reconcile live plan bindings
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AGENT_TOKEN: ${{ secrets.GH_AW_AGENT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REVIEWS: "squad-review-architect.lock.yml,squad-review-security.lock.yml,squad-review-verifier.lock.yml,squad-review-devops.lock.yml"
        with:
          github-token: ${{ github.token }}
          script: |
            const { CHECK, reconcileIssue, reconcileWaiver, sweep } = require('./.github/scripts/plan-binding');
            const { resolveScopeFromGitHub } = require('./.github/scripts/review-attestation');
            const agent = getOctokit(process.env.AGENT_TOKEN);
            const { owner, repo } = context.repo;
            const repositoryOwner = context.payload.repository?.owner?.login || owner;
            const prNumber = context.payload.pull_request?.number;
            const issueNumber = context.payload.issue?.number;
            const errors = [];
            const refPattern = /(?:issue\s+|relates to\s+|part of\s+|closes\s+|fixes\s+|resolves\s+)(?:([a-z0-9_.-]+)\/([a-z0-9_.-]+))?#(\d+)\b/gi;

            const readIssue = async (number) => (await github.rest.issues.get({ owner, repo, issue_number: number })).data;
            const listComments = async (number) => github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
            const listTimeline = async (number) => github.paginate('GET /repos/{owner}/{repo}/issues/{issue_number}/timeline', { owner, repo, issue_number: number, per_page: 100 });

            const api = {
              readIssue,
              listComments,
              listTimeline,
              async readPullRequest(number) {
                return (await github.rest.pulls.get({ owner, repo, pull_number: number })).data;
              },
              async resolveScope(pr, events) {
                return resolveScopeFromGitHub(pr, events, {
                  token: process.env.GH_TOKEN,
                  api: process.env.GITHUB_API_URL || 'https://api.github.com', owner, repo,
                });
              },
              async latestBinding(sha) {
                const checks = await github.paginate(github.rest.checks.listForRef, {
                  owner, repo, ref: sha, check_name: CHECK, per_page: 100,
                });
                return checks.filter(check => check.name === CHECK).sort((a, b) => b.id - a.id)[0];
              },
              async approvalPending() {
                const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                  owner, repo, workflow_id: 'squad-plan-approved.yml', per_page: 100,
                });
                return runs.some(run => run.status !== 'completed');
              },
              async findLinkedPullRequests(number) {
                const query = `query($owner:String!,$repo:String!,$after:String){repository(owner:$owner,name:$repo){pullRequests(first:100,after:$after,states:[OPEN,MERGED]){pageInfo{hasNextPage,endCursor}nodes{number,state,body,headRefOid,isDraft,autoMergeRequest{enabledAt},labels(first:100){nodes{name}},baseRepository{nameWithOwner},closingIssuesReferences(first:100){pageInfo{hasNextPage,endCursor}nodes{number,repository{nameWithOwner}}}}}}}`;
                const allPrs = [];
                let after = null;
                do {
                  const { repository } = await github.graphql(query, { owner, repo, after });
                  const connection = repository.pullRequests;
                  allPrs.push(...connection.nodes);
                  if (connection.pageInfo.hasNextPage && (!connection.pageInfo.endCursor || connection.pageInfo.endCursor === after)) throw new Error('Linked-PR pagination did not advance.');
                  after = connection.pageInfo.hasNextPage ? connection.pageInfo.endCursor : null;
                } while (after);
                const timelineEvents = await listTimeline(number);
                const referenced = new Set();
                for (const event of timelineEvents) {
                  if (event.event === 'cross-referenced' && event.source?.issue?.pull_request?.url) {
                    const match = event.source.issue.pull_request.url.match(new RegExp(`/repos/${owner}/${repo}/pulls/(\\d+)$`, 'i'));
                    if (match) referenced.add(Number(match[1]));
                  }
                }
                const result = [];
                for (const item of allPrs) {
                  let closingConnection = item.closingIssuesReferences;
                  const closingRefs = [...closingConnection.nodes];
                  while (closingConnection.pageInfo.hasNextPage) {
                    const { repository } = await github.graphql(
                      'query($owner:String!,$repo:String!,$number:Int!,$after:String!){repository(owner:$owner,name:$repo){pullRequest(number:$number){closingIssuesReferences(first:100,after:$after){pageInfo{hasNextPage,endCursor}nodes{number,repository{nameWithOwner}}}}}}',
                      { owner, repo, number: item.number, after: closingConnection.pageInfo.endCursor });
                    const next = repository.pullRequest.closingIssuesReferences;
                    if (next.pageInfo.hasNextPage && (!next.pageInfo.endCursor || next.pageInfo.endCursor === closingConnection.pageInfo.endCursor)) throw new Error('Closing-reference pagination did not advance.');
                    closingRefs.push(...next.nodes);
                    closingConnection = next;
                  }
                  const localClosingRefs = closingRefs.filter(ref => ref.repository.nameWithOwner.toLowerCase() === `${owner}/${repo}`.toLowerCase());
                  const bodyRefs = [...(item.body || '').matchAll(refPattern)].some(match =>
                    (!match[1] || (match[1].toLowerCase() === owner.toLowerCase() && match[2].toLowerCase() === repo.toLowerCase()))
                    && Number(match[3]) === number);
                  const closing = localClosingRefs.some(ref => ref.number === number);
                  if (!bodyRefs && !closing && !referenced.has(item.number)) continue;
                  const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: item.number });
                  const prTimeline = await listTimeline(item.number);
                  result.push({
                    number: item.number,
                    state: item.state.toLowerCase(),
                    body: pr.body,
                    labels: pr.labels.map(label => label.name),
                    head: { sha: pr.head.sha },
                    base: { repo: { name: pr.base.repo.name, full_name: pr.base.repo.full_name } },
                    auto_merge: !!pr.auto_merge,
                    closingIssuesReferences: localClosingRefs,
                    linkedFromIssueTimeline: referenced.has(item.number),
                    timeline: prTimeline,
                  });
                }
                return result;
              },
              async writeRecord(number, body) {
                await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
              },
              async removeLabel(number, name) {
                await agent.rest.issues.removeLabel({ owner, repo, issue_number: number, name });
              },
              async commentIssue(number, body) {
                await agent.rest.issues.createComment({ owner, repo, issue_number: number, body });
              },
              async commentPr(number, body) {
                await agent.rest.issues.createComment({ owner, repo, issue_number: number, body });
              },
              async disableAutoMerge(pr) {
                await agent.graphql('mutation($id:ID!){disablePullRequestAutoMerge(input:{pullRequestId:$id}){clientMutationId}}', { id: pr.node_id || (await github.rest.pulls.get({ owner, repo, pull_number: pr.number })).data.node_id });
              },
              async unassign(number) {
                await agent.request('DELETE /repos/{owner}/{repo}/issues/{issue_number}/assignees', {
                  owner, repo, issue_number: number, assignees: ['copilot-swe-agent[bot]'],
                });
              },
              async setStatus(sha, state, description) {
                await github.rest.checks.create({
                  owner, repo, name: 'Squad Plan Binding', head_sha: sha, status: 'completed',
                  conclusion: state,
                  details_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                  output: {
                    title: state === 'success'
                      ? (description.startsWith('Exempt:') ? 'Owner waiver verified (issue-plan exempt)' : 'Plan binding verified')
                      : 'Plan binding failed',
                    summary: description.slice(0, 65000),
                  },
                });
              },
            };

            const runOne = async (number) => {
              const result = await reconcileIssue(api, { issueNumber: number, owner: repositoryOwner });
              core.info(`#${number}: ${result.state}${result.reason ? ` — ${result.reason}` : ''}`);
              if (result.state === 'error') throw new Error(`#${number}: ${result.reason}`);
              return result;
            };
            const sweepBoundAndLegacy = async () => {
              // Required checks apply globally, including existing waived PRs.
              // Include waiver history so a lost removal event cannot leave an
              // old exemption green. Do this before genuine issue bindings.
              const openPrs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 });
              for (const pr of openPrs) {
                try {
                  if (pr.labels.some(label => label.name === 'plan:waived')
                      || (await listTimeline(pr.number)).some(event => event.label?.name === 'plan:waived')) {
                    await reconcileWaiver(api, { prNumber: pr.number, force: true });
                  }
                } catch (error) {
                  errors.push(`PR #${pr.number}: ${error.message}`);
                }
              }
              const [bound, approved] = await Promise.all([
                github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', labels: 'plan:bound', per_page: 100 }),
                github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', labels: 'plan:approved', per_page: 100 }),
              ]);
              const issueNumbers = [...new Set([...bound, ...approved].filter(i => !i.pull_request).map(i => i.number))];
              const outcomes = await sweep(api, { owner: repositoryOwner, issueNumbers });
              for (const outcome of outcomes) {
                core.info(`#${outcome.issueNumber}: ${outcome.state}${outcome.reason ? ` — ${outcome.reason}` : ''}`);
                if (outcome.state === 'error') errors.push(`#${outcome.issueNumber}: ${outcome.reason}`);
              }
            };
            const issueRefsForPr = async (number) => {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
              const refs = new Set();
              for (const match of pr.body?.matchAll(refPattern) || []) {
                if (!match[1] || (match[1].toLowerCase() === owner.toLowerCase() && match[2].toLowerCase() === repo.toLowerCase())) refs.add(Number(match[3]));
              }
              const events = await listTimeline(number);
              for (const event of events) {
                if (event.event === 'cross-referenced' && event.source?.issue && !event.source.issue.pull_request
                    && event.source.issue.repository?.full_name?.toLowerCase() === `${owner}/${repo}`.toLowerCase()) {
                  refs.add(event.source.issue.number);
                }
              }
              let after = null;
              do {
                const { repository } = await github.graphql(
                  'query($owner:String!,$repo:String!,$number:Int!,$after:String){repository(owner:$owner,name:$repo){pullRequest(number:$number){baseRepository{nameWithOwner} closingIssuesReferences(first:100,after:$after){pageInfo{hasNextPage,endCursor}nodes{number,repository{nameWithOwner}}}}}}',
                  { owner, repo, number, after },
                );
                if (repository.pullRequest.baseRepository?.nameWithOwner !== `${owner}/${repo}`) return [];
                const connection = repository.pullRequest.closingIssuesReferences;
                for (const ref of connection.nodes) {
                  if (ref.repository.nameWithOwner.toLowerCase() === `${owner}/${repo}`.toLowerCase()) refs.add(ref.number);
                }
                if (connection.pageInfo.hasNextPage && (!connection.pageInfo.endCursor || connection.pageInfo.endCursor === after)) throw new Error('Closing-reference pagination did not advance.');
                after = connection.pageInfo.hasNextPage ? connection.pageInfo.endCursor : null;
              } while (after);
              return [...refs].filter(n => Number.isSafeInteger(n) && n > 0);
            };

            try {
              if (context.eventName === 'issue_comment') {
                if (context.payload.issue.pull_request) {
                  return core.info('Ignoring pull request conversation comments; pull_request_target handles PR changes.');
                }
                const commentBody = context.payload.comment?.body || '';
                if (commentBody.includes('<!-- squad-plan-binding-failure -->')
                    || commentBody.includes('<!-- squad-plan-binding:')) {
                  return core.info('Ignoring an internal binding notice.');
                }
                await runOne(issueNumber);
              } else if (context.eventName === 'issues') {
                // The approval caller owns this event; its workflow_run completion
                // reconciles bot writes. Do not race a new approval as a migration.
                if (context.payload.action === 'labeled' && context.payload.label?.name === 'plan:approved'
                    && context.payload.sender?.login === repositoryOwner) return core.info('Waiting for Squad Plan Approved completion.');
                if (context.payload.label?.name === 'plan:approved' || context.payload.label?.name === 'plan:bound'
                    || context.payload.label?.name === 'handoff:local') await runOne(issueNumber);
              } else if (context.eventName === 'pull_request_target') {
                const labelEvent = ['labeled', 'unlabeled'].includes(context.payload.action);
                if (labelEvent && context.payload.label?.name !== 'plan:waived') return;
                const waiver = await reconcileWaiver(api, { prNumber, force: labelEvent });
                if (waiver.state === 'waived') {
                  // The existing approval/waiver caller owns initial label
                  // dispatch; avoid duplicate runs/cancellation. Edits and new
                  // heads require fresh reviews under the verified waiver.
                  if (context.payload.action !== 'labeled' && !waiver.pr.draft
                      && !waiver.pr.labels.some(label => label.name === 'needs:human')) {
                    for (const workflow of process.env.REVIEWS.split(',')) {
                      await agent.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: workflow, ref: context.payload.repository.default_branch, inputs: { pr_number: String(prNumber) } });
                    }
                  }
                  return;
                }
                if (waiver.pr.labels.some(label => label.name === 'plan:waived') || waiver.state === 'closed') return;
                const refs = await issueRefsForPr(prNumber);
                const outcomes = [];
                for (const number of refs) outcomes.push(await runOne(number));
                const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
                if (pr.state === 'open' && !pr.draft && !pr.labels.some(label => label.name === 'needs:human')) {
                  let shouldDispatch = false;
                  for (const outcome of outcomes) {
                    if (outcome.state === 'bound' && outcome.record
                        && (await readIssue(outcome.record.issue)).labels.some(label => label.name === 'handoff:local')) {
                      shouldDispatch = true;
                    }
                  }
                  const bindings = outcomes.filter(outcome => outcome.state === 'bound' && outcome.record);
                  if (shouldDispatch && bindings.length === 1) {
                    for (const workflow of process.env.REVIEWS.split(',')) {
                      await agent.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: workflow, ref: context.payload.repository.default_branch, inputs: { pr_number: String(prNumber) } });
                    }
                  }
                }
              } else {
                await sweepBoundAndLegacy();
              }
            } catch (error) {
              core.error(error.message);
              errors.push(error.message);
            }
            if (errors.length) core.setFailed(errors.join('\n'));

      - name: Report reconciliation failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HUMAN: cedricmendelin
        with:
          github-token: ${{ secrets.GH_AW_AGENT_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const title = 'Squad Plan Binding reconciliation failed';
            const marker = '<!-- squad-plan-binding-failure -->';
            const body = `${marker}\n@${process.env.HUMAN} **Squad Plan Binding** failed: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}\n\nCheck the run logs and reconcile affected issues/PRs. The binding status fails closed where a current status could be published.`;
            const open = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', labels: 'needs:human', per_page: 100 });
            const existing = open.find(issue => issue.title === title);
            if (!existing) {
              await github.rest.issues.create({ owner, repo, title, body, labels: ['needs:human'], assignees: [process.env.HUMAN] });
            } else {
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: existing.number, per_page: 100 });
              const report = comments.find(comment => comment.body?.includes(marker));
              if (report) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: report.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
              }
            }

name: Squad PR Shepherd

# Moves Copilot cloud agent PRs (`copilot/*` branches without `handoff:local`)
# through the lifecycle only after the latest Copilot session succeeds.

on:
  workflow_run:
    # The Copilot cloud agent's dynamic workflow; completes after every session.
    workflows: [Copilot cloud agent]
    types: [completed]
  push:
    branches: [main]
  schedule:
    # Fallback for missed events (stalled reviews, conflicts after merges).
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number (empty = all open Copilot PRs)
        required: false
        type: string
      dry_run:
        description: Log the shepherd's decisions without changing the PR or dispatching workflows
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: squad-pr-shepherd
  cancel-in-progress: false

jobs:
  shepherd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      issues: write
    steps:
      - name: Checkout default branch decision module
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Shepherd Copilot pull requests
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AGENT_TOKEN: ${{ secrets.GH_AW_AGENT_TOKEN }}
          HUMAN: cedricmendelin
          REVIEWS: "Architect:squad-review-architect.lock.yml,Security:squad-review-security.lock.yml,Verifier:squad-review-verifier.lock.yml,DevOps:squad-review-devops.lock.yml"
          REVIEW_TIMEOUT_MINUTES: "60"
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { resolve } = require('node:path');
            const {
              approvalRequiredRuns, classifySession, formatApprovalDiagnostic,
              hasRunnableCiRun, recoveryAction,
            } = await import(pathToFileURL(resolve('.github/scripts/session-state.mjs')).href);

            // Reads use GITHUB_TOKEN (fine-grained PATs cannot read checks).
            // Writes use the owner PAT so @copilot comments and dispatches trigger.
            const agent = getOctokit(process.env.AGENT_TOKEN);
            const { owner, repo } = context.repo;
            const human = process.env.HUMAN;
            const dryRun = process.env.DRY_RUN === 'true';
            const reviews = process.env.REVIEWS.split(',').map(s => { const [role, file] = s.split(':'); return { role, file }; });
            const { data: repository } = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repository.default_branch;
            const sleep = (ms) => new Promise(r => setTimeout(r, ms));
            const workflows = await github.paginate(github.rest.actions.listRepoWorkflows, { owner, repo, per_page: 100 });
            const copilotWorkflow = workflows.find(w => (w.path || '').startsWith('dynamic/copilot-swe-agent'));
            let repositoryRuns;

            const labelsOf = (pr) => pr.labels.map(l => l.name);
            const isAgentPr = (pr) => pr.head.ref.startsWith('copilot/')
              && pr.head.repo?.full_name === `${owner}/${repo}`
              && !labelsOf(pr).includes('handoff:local');

            const input = context.payload.inputs?.pr_number;
            let numbers;
            if (input) {
              numbers = [Number(input)];
            } else if (context.eventName === 'workflow_run') {
              const branch = context.payload.workflow_run.head_branch;
              const { data } = await github.rest.pulls.list({ owner, repo, state: 'open', head: `${owner}:${branch}` });
              numbers = data.map(p => p.number);
            } else {
              const open = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 });
              numbers = open.map(p => p.number);
            }

            for (const number of numbers) {
              try {
                await shepherd(number);
              } catch (error) {
                core.error(`PR #${number}: ${error.message}`);
                process.exitCode = 1;
              }
            }
            if (process.exitCode) core.setFailed('Shepherding failed for at least one PR.');

            async function getPr(number) {
              let { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
              if (pr.state === 'open' && pr.mergeable === null) {
                await sleep(5000);
                ({ data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number }));
              }
              return pr;
            }

            async function shepherd(number) {
              const pr = await getPr(number);
              if (pr.state !== 'open' || !isAgentPr(pr)) return core.info(`#${number}: not an open Copilot PR.`);
              if (labelsOf(pr).includes('needs:human')) return core.info(`#${number}: waiting for @${human} (needs:human).`);

              const sha = pr.head.sha;
              const short = sha.slice(0, 7);
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
              const findMarker = (m) => comments.find(c => (c.body || '').includes(m));
              const comment = (body) => {
                if (dryRun) return core.info(`#${number}: dry run; would comment:\n${body}`);
                return agent.rest.issues.createComment({ owner, repo, issue_number: number, body });
              };
              const dispatch = (workflow_id, ref, inputs) => {
                if (dryRun) return core.info(`#${number}: dry run; would dispatch ${workflow_id} for ${ref}.`);
                return agent.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id, ref, inputs });
              };
              const escalate = async (marker, reason) => {
                if (findMarker(marker)) return core.info(`#${number}: escalation already recorded.`);
                if (dryRun) {
                  core.info(`#${number}: dry run; would add needs:human, assign @${human}, and escalate: ${reason}`);
                  return;
                }
                await agent.rest.issues.addLabels({ owner, repo, issue_number: number, labels: ['needs:human'] });
                await agent.rest.issues.addAssignees({ owner, repo, issue_number: number, assignees: [human] }).catch(() => {});
                await comment(`${marker}\n🙋 @${human} human decision needed: ${reason}\n\nRemove \`needs:human\` to hand the PR back to the automation.`);
              };

              const agentRuns = copilotWorkflow
                ? (await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: copilotWorkflow.id, branch: pr.head.ref, per_page: 20 })).data.workflow_runs
                : [];
              const session = classifySession(agentRuns);
              const approvalMarker = `<!-- squad-shepherd:approval:${sha} -->`;
              if (!findMarker(approvalMarker)) {
                repositoryRuns ||= (await github.rest.actions.listWorkflowRunsForRepo({ owner, repo, per_page: 100 })).data.workflow_runs;
                const approvalRuns = approvalRequiredRuns(repositoryRuns, { number, branch: pr.head.ref, sha });
                if (approvalRuns.length) {
                  const checks = await github.paginate(github.rest.checks.listForRef, { owner, repo, ref: sha, per_page: 100 });
                  const diagnostic = formatApprovalDiagnostic(approvalRuns, {
                    ciPassing: checks.some(c => c.name === 'ci' && c.status === 'completed' && c.conclusion === 'success'),
                    sessionState: session.state,
                  });
                  await comment(`${approvalMarker}\n${diagnostic}`);
                }
              }

              if (session.state === 'active') return core.info(`#${number}: Copilot session ${session.run.id} is still working.`);
              if (session.state === 'none') return core.info(`#${number}: no Copilot cloud-agent session is available; waiting.`);
              if (session.state === 'interrupted') {
                const recoveryMarkers = comments.filter(c => /<!-- squad-shepherd:recover:\d+ -->/.test(c.body || ''));
                const runCreatedAt = Date.parse(session.run.created_at) || 0;
                const recoveryRun = recoveryMarkers.some(c => (Date.parse(c.created_at) || 0) <= runCreatedAt);
                const marker = `<!-- squad-shepherd:recover:${session.run.id} -->`;
                let action = recoveryAction({
                  state: session.state,
                  recoveriesSoFar: recoveryMarkers.length,
                  hasMarker: !!findMarker(marker),
                  recoveryRun,
                });
                let canRecover = false;
                if (action === 'recover') {
                  if (labelsOf(pr).includes('plan:waived')) {
                    canRecover = true;
                  } else {
                    const { repository: linked } = await github.graphql(
                      `query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){closingIssuesReferences(first:100){nodes{labels(first:100){nodes{name}}}}}}}`,
                      { owner, repo, number },
                    );
                    canRecover = linked.pullRequest.closingIssuesReferences.nodes
                      .some(issue => issue.labels.nodes.some(label => label.name === 'plan:approved'));
                  }
                  action = recoveryAction({ state: session.state, recoveriesSoFar: recoveryMarkers.length, canRecover });
                }

                if (action === 'recover') {
                  const titleHint = pr.title.startsWith('[WIP]') ? ' The [WIP] title is only a hint; the workflow conclusion is authoritative.' : '';
                  await comment(`${marker}\n@copilot Your last session was \`${session.run.conclusion}\` (${session.run.html_url}). Continue the approved plan from the current branch state, complete the PR description, and run the build and tests. Do not change scope.${titleHint}`);
                  return core.info(`#${number}: requested bounded recovery for interrupted session ${session.run.id}.`);
                }
                if (action === 'escalate') {
                  const outcome = recoveryRun ? 'the recovery session was interrupted' : `the latest session concluded \`${session.run.conclusion}\``;
                  return escalate(
                    `<!-- squad-shepherd:interrupted:${session.run.id} -->`,
                    `${outcome} (${session.run.html_url}) and recovery is not safe to continue automatically. Re-run the session after reviewing the branch, add \`handoff:local\` to take over, or close the PR.`,
                  );
                }
                return core.info(`#${number}: interrupted session ${session.run.id} already has a recovery request.`);
              }

              if (pr.draft) {
                if (dryRun) {
                  core.info(`#${number}: dry run; would mark the successful PR ready and dispatch CI/reviews.`);
                } else {
                  await agent.graphql('mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){clientMutationId}}', { id: pr.node_id });
                  core.info(`#${number}: marked ready for review after successful Copilot session.`);
                }
              }

              if (pr.mergeable === false) {
                const { data: base } = await github.rest.repos.getBranch({ owner, repo, branch: pr.base.ref });
                const marker = `<!-- squad-shepherd:conflict:${sha}:${base.commit.sha} -->`;
                if (findMarker(marker)) return core.info(`#${number}: conflict fix already requested.`);
                const previous = comments.filter(c => (c.body || '').includes('<!-- squad-shepherd:conflict:')).length;
                if (previous >= 3) return escalate(`<!-- squad-shepherd:conflict-stuck:${sha} -->`, `this PR still conflicts with \`${pr.base.ref}\` after ${previous} attempts by Copilot. Resolve the conflicts manually.`);
                await comment(`${marker}\n@copilot This PR has merge conflicts with \`${pr.base.ref}\`. Merge the latest \`${pr.base.ref}\` into this branch and resolve the conflicts, keeping the approved plan's scope. Do not change unrelated files.`);
                return core.info(`#${number}: asked Copilot to resolve conflicts.`);
              }

              // A finished session that pushed nothing while blocking findings are open: the loop is stuck.
              if (context.eventName === 'workflow_run') {
                const fix = findMarker(`<!-- squad-gate:fix:${sha} -->`);
                if (fix && new Date(context.payload.workflow_run.created_at) > new Date(fix.created_at)) {
                  return escalate(`<!-- squad-shepherd:stalled:${sha} -->`, `Copilot finished a session after the Squad Review findings for ${short} without pushing changes. It may disagree with a finding; read its reply and either dispatch the reviewers again (Actions → *Squad Review X* → Run workflow with \`pr_number=${number}\`), fix it yourself, or close the PR.`);
                }
              }

              const ciRuns = (await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: 'ci.yml', head_sha: sha, per_page: 20 })).data.workflow_runs;
              if (!hasRunnableCiRun(ciRuns)) {
                await dispatch('ci.yml', pr.head.ref, undefined);
                core.info(`#${number}: started CI for ${short}.`);
              }

              const reviewMarker = `<!-- squad-shepherd:review:${sha} -->`;
              const started = findMarker(reviewMarker);
              if (!started) {
                for (const r of reviews) {
                  await dispatch(r.file, defaultBranch, { pr_number: String(number) });
                }
                await comment(`${reviewMarker}\n🧭 Copilot finished a session at ${short}. Started CI and Squad Review (${reviews.map(r => r.role).join(', ')}). Blocking findings go back to Copilot automatically; when everything is green the PR squash auto-merges.`);
                return core.info(`#${number}: started Squad Review for ${short}.`);
              }

              const ageMinutes = (Date.now() - new Date(started.created_at).getTime()) / 60000;
              if (ageMinutes > Number(process.env.REVIEW_TIMEOUT_MINUTES)) {
                const checks = await github.paginate(github.rest.checks.listForRef, { owner, repo, ref: sha, per_page: 100 });
                const missing = reviews.map(r => `Squad Review / ${r.role}`).filter(n => !checks.some(c => c.name === n && c.status === 'completed'));
                if (missing.length) {
                  await escalate(`<!-- squad-shepherd:review-timeout:${sha} -->`, `${missing.join(', ')} did not publish a result for ${short} within ${process.env.REVIEW_TIMEOUT_MINUTES} minutes. Check the *Squad Review* runs in Actions, then re-run them with \`pr_number=${number}\`.`);
                }
              }
            }

      - name: Escalate automation failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HUMAN: cedricmendelin
        with:
          script: |
            const { owner, repo } = context.repo;
            const human = process.env.HUMAN;
            const title = `Squad automation failing: ${context.workflow}`;
            const url = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const open = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', labels: 'needs:human', per_page: 100 });
            const existing = open.find(i => i.title === title);
            const body = `@${human} **${context.workflow}** failed: ${url}\n\nCommon causes: \`GH_AW_AGENT_TOKEN\` expired or missing a permission (see docs/workflow.md → Creating the tokens), or a repository setting changed. Close this issue once fixed.`;
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: ['needs:human'], assignees: [human] });
            }

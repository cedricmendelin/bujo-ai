name: Deploy production

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: terraform-prod
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      container_image: ${{ steps.image.outputs.container_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to GHCR
        if: hashFiles('Dockerfile') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push image
        if: hashFiles('Dockerfile') != ''
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          tags: ghcr.io/cedricmendelin/bujo-ai:${{ github.sha }}

      - name: Set deployment image
        id: image
        run: |
          if [[ -f Dockerfile ]]; then
            echo "container_image=ghcr.io/cedricmendelin/bujo-ai:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "container_image=mcr.microsoft.com/k8se/quickstart:latest" >> "$GITHUB_OUTPUT"
          fi

  apply:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: prod
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      TF_VAR_container_image: ${{ needs.image.outputs.container_image }}
      TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP }}
      TF_VAR_sql_entra_admin_object_id: ${{ vars.SQL_ENTRA_ADMIN_OBJECT_ID }}
      TF_VAR_sql_entra_admin_login: ${{ vars.SQL_ENTRA_ADMIN_LOGIN }}
      TF_VAR_budget_alert_email: ${{ vars.BUDGET_ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Validate deployment variables
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
          TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
          TFSTATE_KEY: ${{ vars.TFSTATE_KEY }}
          SQL_ENTRA_ADMIN_OBJECT_ID: ${{ vars.SQL_ENTRA_ADMIN_OBJECT_ID }}
          SQL_ENTRA_ADMIN_LOGIN: ${{ vars.SQL_ENTRA_ADMIN_LOGIN }}
          BUDGET_ALERT_EMAIL: ${{ vars.BUDGET_ALERT_EMAIL }}
        run: |
          for name in \
            ARM_CLIENT_ID ARM_TENANT_ID ARM_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP \
            TFSTATE_RESOURCE_GROUP TFSTATE_STORAGE_ACCOUNT TFSTATE_CONTAINER \
            TFSTATE_KEY SQL_ENTRA_ADMIN_OBJECT_ID SQL_ENTRA_ADMIN_LOGIN \
            BUDGET_ALERT_EMAIL; do
            if [[ -z "${!name}" ]]; then
              echo "Required GitHub Actions variable is missing: $name" >&2
              exit 1
            fi
          done

      - name: Sign in to Azure with OIDC
        uses: Azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize Terraform
        env:
          TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
          TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
          TFSTATE_KEY: ${{ vars.TFSTATE_KEY }}
        run: |
          terraform -chdir=infra init -input=false \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="key=$TFSTATE_KEY" \
            -backend-config="use_oidc=true"

      - name: Plan and apply
        run: |
          log_file="$RUNNER_TEMP/terraform-deploy.log"
          redacted_log="$RUNNER_TEMP/terraform-deploy-redacted.log"
          redact_log() {
            python - "$log_file" "$redacted_log" <<'PY'
          import os
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text()
          for key in (
              "ARM_SUBSCRIPTION_ID",
              "ARM_TENANT_ID",
              "ARM_CLIENT_ID",
              "TF_VAR_sql_entra_admin_object_id",
              "TF_VAR_budget_alert_email",
          ):
              value = os.environ.get(key)
              if value:
                  text = text.replace(value, "[REDACTED]")
          Path(sys.argv[2]).write_text(text)
          PY
          }
          if ! terraform -chdir=infra plan -input=false -no-color \
            -var-file=prod.tfvars -out="$RUNNER_TEMP/prod.tfplan" > "$log_file" 2>&1; then
            redact_log
            tail -n 40 "$redacted_log"
            exit 1
          fi
          if ! terraform -chdir=infra apply -input=false -auto-approve \
            "$RUNNER_TEMP/prod.tfplan" >> "$log_file" 2>&1; then
            redact_log
            tail -n 40 "$redacted_log"
            exit 1
          fi
          echo "Terraform plan and apply succeeded."

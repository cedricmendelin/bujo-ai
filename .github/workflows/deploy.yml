name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main-push CI run to resume
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-prod
  cancel-in-progress: false

jobs:
  authorize:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      admitted: ${{ steps.release.outputs.admitted }}
      sha: ${{ steps.release.outputs.sha }}
      image: ${{ steps.release.outputs.image }}
      run_id: ${{ steps.release.outputs.run_id }}
      run_attempt: ${{ steps.release.outputs.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Admit exact successful main CI release before Azure access
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/release_admission.py admit --manifest "$RUNNER_TEMP/release.json"

  apply:
    needs: authorize
    if: needs.authorize.outputs.admitted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: prod
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_USE_CLI: "false"
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
      TFSTATE_KEY: ${{ vars.TFSTATE_KEY }}
      SQL_ENTRA_ADMIN_OBJECT_ID: ${{ vars.SQL_ENTRA_ADMIN_OBJECT_ID }}
      SQL_ENTRA_ADMIN_LOGIN: ${{ vars.SQL_ENTRA_ADMIN_LOGIN }}
      BUDGET_ALERT_EMAIL: ${{ vars.BUDGET_ALERT_EMAIL }}
      API_ALLOWED_PRINCIPAL_OBJECT_IDS: ${{ vars.API_ALLOWED_PRINCIPAL_OBJECT_IDS }}
      BUJO_DEPLOYMENT_ENABLED: ${{ vars.BUJO_DEPLOYMENT_ENABLED }}
      BUJO_OWNER_SETUP_CONFIRMED: ${{ vars.BUJO_OWNER_SETUP_CONFIRMED }}
      TF_VAR_container_image: ${{ needs.authorize.outputs.image }}
      TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP }}
      TF_VAR_deployment_client_id: ${{ vars.AZURE_CLIENT_ID }}
      TF_VAR_sql_entra_admin_object_id: ${{ vars.SQL_ENTRA_ADMIN_OBJECT_ID }}
      TF_VAR_sql_entra_admin_login: ${{ vars.SQL_ENTRA_ADMIN_LOGIN }}
      TF_VAR_budget_alert_email: ${{ vars.BUDGET_ALERT_EMAIL }}
      TF_VAR_auth_allowed_principal_object_ids: ${{ vars.API_ALLOWED_PRINCIPAL_OBJECT_IDS }}
      BUJO_RELEASE_SHA: ${{ needs.authorize.outputs.sha }}
      BUJO_RELEASE_RUN_ID: ${{ needs.authorize.outputs.run_id }}
      BUJO_RELEASE_RUN_ATTEMPT: ${{ needs.authorize.outputs.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false

      - name: Revalidate release after queueing
        run: |
          python3 .github/scripts/release_admission.py admit --manifest "$RUNNER_TEMP/release.json"
          python3 .github/scripts/release_admission.py recheck --manifest "$RUNNER_TEMP/release.json"

      - name: Require explicit owner activation and completed setup
        run: python3 .github/scripts/deployment_preflight.py

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false

      - name: Sign in to Azure with OIDC
        uses: Azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize Terraform using Entra state access
        run: |
          terraform -chdir=infra init -input=false \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="key=$TFSTATE_KEY" \
            -backend-config="use_oidc=true"

      - name: Verify live bootstrap and anonymous release-image access
        run: python3 .github/scripts/deployment_preflight.py --live --manifest "$RUNNER_TEMP/release.json"

      - name: Migrate exact release, promote, and verify runtime
        env:
          BUJO_RELEASE_VALIDATED: "true"
          BUJO_RELEASE_MANIFEST: ${{ runner.temp }}/release.json
        run: python3 infra/deploy_gate.py

name: Infrastructure plan

on:
  pull_request:
    paths:
      - infra/**
      - .github/workflows/**

permissions:
  contents: read

concurrency:
  group: infra-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_PLAN_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      TF_VAR_sql_entra_admin_name: ${{ vars.SQL_ENTRA_ADMIN_NAME }}
      TF_VAR_sql_entra_admin_object_id: ${{ vars.SQL_ENTRA_ADMIN_OBJECT_ID }}
      TF_VAR_budget_alert_email: ${{ vars.BUDGET_ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Sign in to Azure with OIDC
        uses: Azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_PLAN_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize Terraform
        env:
          TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
          TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
          TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
        run: |
          terraform -chdir=infra init -input=false \
            -backend-config="resource_group_name=$TF_STATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TF_STATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TF_STATE_CONTAINER" \
            -backend-config="key=prod.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      - name: Format and validate
        run: |
          terraform -chdir=infra fmt -check -recursive
          terraform -chdir=infra validate

      - name: Create Terraform plan
        run: |
          if ! terraform -chdir=infra plan -input=false -no-color -lock=false \
            -var-file=prod.tfvars -out=tfplan > "$RUNNER_TEMP/terraform-plan.log" 2>&1; then
            echo "Terraform plan failed. Review the workflow configuration and Azure permissions."
            exit 1
          fi
          terraform -chdir=infra show -no-color tfplan > "$RUNNER_TEMP/terraform-plan.txt"

      - name: Redact plan values
        env:
          PLAN_FILE: ${{ runner.temp }}/terraform-plan.txt
          REDACTED_PLAN_FILE: ${{ github.workspace }}/infra/plan-redacted.txt
          REDACT_VALUES: ${{ vars.AZURE_SUBSCRIPTION_ID }},${{ vars.AZURE_TENANT_ID }},${{ vars.AZURE_PLAN_CLIENT_ID }},${{ vars.SQL_ENTRA_ADMIN_OBJECT_ID }},${{ vars.BUDGET_ALERT_EMAIL }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          text = Path(os.environ["PLAN_FILE"]).read_text()
          for value in os.environ["REDACT_VALUES"].split(","):
              if value:
                  text = text.replace(value, "[REDACTED]")
          Path(os.environ["REDACTED_PLAN_FILE"]).write_text(text)
          PY

      - name: Comment plan summary
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- bujo-ai-infra-plan -->';
            const plan = fs.readFileSync('infra/plan-redacted.txt', 'utf8');
            const summary = plan.match(/Plan: [^\n]*/) || ['Plan result is shown below.'];
            const preview = plan.length > 42000
              ? `${plan.slice(0, 42000)}\n\n[Plan output truncated.]`
              : plan;
            const body = [
              marker,
              '## Terraform plan',
              `Base commit: \`${process.env.BASE_SHA}\` (the plan can be stale if the remote state changed after this commit).`,
              '',
              summary[0],
              '',
              '<details><summary>Show redacted plan output</summary>',
              '',
              '```terraform',
              preview,
              '```',
              '</details>',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(comment => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

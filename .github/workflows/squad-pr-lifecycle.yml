name: Squad PR Lifecycle

# All privileged decisions use this workflow from the default branch. It reads
# PR metadata and checks only; it never checks out or executes pull-request code.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, edited, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]
  # Actions has no pull_request_review_thread resolution trigger. After resolving
  # a blocking thread without another PR/review event, use workflow_dispatch with
  # this PR number to re-evaluate. Arbitrary issue comments are not repair input.
  workflow_run:
    workflows:
      - Copilot cloud agent
      - CI
      - Squad Review Architect
      - Squad Review Security
      - Squad Review Verifier
      - Squad Review DevOps
      - Squad Acceptance Recovery
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Re-evaluate or manually recover one pull request
        required: true
        type: string
      resume_repairs:
        description: Explicitly clear the human pause and start a new repair episode after inspecting its cause
        default: false
        type: boolean
  issues:
    types: [edited, closed, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  route:
    if: >-
      (github.event_name != 'issues' || contains(github.event.issue.body, 'Split PR: #') || contains(github.event.changes.body.from, 'Split PR: #'))
      && (github.event_name != 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      numbers: ${{ steps.route.outputs.numbers }}
      found: ${{ steps.route.outputs.found }}
    steps:
      - name: Route the event to pull request numbers (read only)
        id: route
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const runEvent = context.payload.workflow_run;
            let numbers = [];
            if (context.eventName === 'workflow_dispatch') numbers = [Number(context.payload.inputs.pr_number)];
            else if (context.eventName === 'schedule') {
              const open = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 });
              numbers = open.filter(pr => pr.head.repo?.full_name === `${owner}/${repo}`
                && !pr.labels.some(label => label.name === 'needs:human')
                && (!pr.draft || pr.head.ref.startsWith('copilot/')
                  && !pr.labels.some(label => label.name === 'handoff:local')))
                .map(pr => pr.number);
              core.info(`Hourly fallback: ${numbers.length} eligible open PR(s).`);
            }
            else if (context.eventName === 'issues') {
              const bodies = [context.payload.issue?.body, context.payload.changes?.body?.from];
              numbers = bodies.flatMap(body => [...(body || '').matchAll(/^Split PR: #([1-9]\d*)[ \t]*$/gm)].map(match => Number(match[1])));
            }
            else if (context.payload.pull_request) numbers = [context.payload.pull_request.number];
            else if (runEvent) {
              const target = (runEvent.display_title || '').match(/^Squad Review (?:Architect|Security|Verifier|DevOps) · PR #([1-9]\d*)(?: · input [a-f0-9]{64})?$/)
                || (runEvent.display_title || '').match(/^Squad Acceptance Recovery · PR #([1-9]\d*) · plan [1-9]\d*$/);
              if (target) numbers = [Number(target[1])];
              if (!numbers.length) numbers = (runEvent.pull_requests || []).map(pr => pr.number);
              if (!numbers.length && runEvent.head_sha) {
                const { data } = await github.request('GET /repos/{owner}/{repo}/commits/{sha}/pulls', {
                  owner, repo, sha: runEvent.head_sha,
                });
                numbers = data.filter(pr => pr.state === 'open').map(pr => pr.number);
              }
              if (!numbers.length && runEvent.head_branch) {
                const data = await github.paginate(github.rest.pulls.list, {
                  owner, repo, state: 'open', head: `${owner}:${runEvent.head_branch}`, per_page: 100,
                });
                numbers = data.map(pr => pr.number);
              }
            }
            numbers = [...new Set(numbers)].filter(number => Number.isSafeInteger(number) && number > 0);
            core.setOutput('numbers', JSON.stringify(numbers));
            core.setOutput('found', numbers.length > 0 ? 'true' : 'false');

  completed-closure-guard:
    if: github.event_name == 'issues' && github.event.action == 'closed'
      && github.event.issue.state_reason == 'completed'
      && !github.event.issue.pull_request
    concurrency:
      group: squad-issue-closure-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout trusted default-branch checklist parser
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Warn when a completed issue retains unchecked criteria
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const { acceptanceTracking } = require('./.github/scripts/completion-declaration');
            const { owner, repo } = context.repo;
            const eventIssue = context.payload.issue;
            if (context.eventName !== 'issues' || context.payload.action !== 'closed'
                || eventIssue?.state_reason !== 'completed' || eventIssue.pull_request) {
              return core.info('Not an explicit completed issue closure; no warning is needed.');
            }
            const number = Number(eventIssue.number);
            if (!Number.isSafeInteger(number) || number < 1) throw new Error('Issue event did not contain a valid issue number.');
            const issue = (await github.rest.issues.get({ owner, repo, issue_number: number })).data;
            if (issue.state !== 'closed' || issue.state_reason !== 'completed' || issue.pull_request) {
              return core.info(`#${number}: live issue state is not a completed issue closure.`);
            }
            const tracking = acceptanceTracking(issue.body);
            if (!tracking.incomplete.length) {
              return core.info(`#${number}: no unchecked acceptance criteria remain.`);
            }
            const marker = `<!-- squad-acceptance-closure-warning:${number}:${require('./.github/scripts/delivery-lifecycle').reviewInputKey(issue.body || '')} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: number, per_page: 100,
            });
            if (comments.some(comment => comment.user?.login === 'github-actions[bot]'
                && (comment.body || '').includes(marker))) {
              return core.info(`#${number}: the warning for this checklist version already exists.`);
            }
            const guidance = tracking.ok
              ? 'Review the remaining owner/next actions and decide whether the issue should be reopened for the existing approved continuation. Once all criteria are complete, mark them checked with evidence.'
              : 'Repair the `## Acceptance tracking` checklist so every remaining criterion has an explicit status, owner, and next action; decide whether the issue should be reopened for the existing approved continuation.';
            await github.rest.issues.createComment({ owner, repo, issue_number: number,
              body: `${marker}\n⚠️ This issue was closed as completed while ${tracking.incomplete.length} acceptance-tracking criterion/criteria remain unchecked. ${guidance} This notice does not reopen the issue or authorize a change in scope.` });

  lifecycle:
    needs: route
    if: needs.route.outputs.found == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        pr_number: ${{ fromJSON(needs.route.outputs.numbers) }}
    # Every trigger, including four default-branch reviewer completions, uses
    # this same PR key. Pending coalescing is safe: each job reads live state.
    concurrency:
      group: squad-pr-lifecycle-${{ github.repository }}-${{ matrix.pr_number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: write
      statuses: read
      pull-requests: read
      issues: write
    steps:
      - name: Checkout trusted default-branch controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Evaluate readiness and bridge review findings
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AGENT_TOKEN: ${{ secrets.GH_AW_AGENT_TOKEN }}
          HUMAN: cedricmendelin
          PR_NUMBER: ${{ matrix.pr_number }}
          REVIEW_ROUTING: ${{ vars.SQUAD_REVIEW_ROUTING }}
        with:
          github-token: ${{ github.token }}
          script: |
            const {
              acceptanceTracking, evaluateCompletion, hasPartialDeclaration,
              repairGeneratedClosingReferences, partialHandoff, removeNonProse,
            } = require('./.github/scripts/completion-declaration');
            const { isEligiblePermission, latestPlan, parsePlan } = require('./.github/scripts/plan-approval');
            const { recoveryInput } = require('./.github/scripts/acceptance-recovery');
            const { readSplit, splitReviewPasses, validateSplit } = require('./.github/scripts/scope-split');
            const {
              actualRepairAttempts, currentHeadCheck, hasHumanBlocks, humanBlockingFeedback, isControllerComment,
              hasRequiredMergeRules, isReviewNone, outstandingFixRequest, readiness, reviewFailures,
              parseFixRequest, reviewDispatchNeeded, reviewNoneRemovedAt, reviewResultIsFresh, reviewRunsForPr,
              repairEpisode, repairOutcomes, reviewEvidence, reviewInputKey, routeReviews,
              MAX_REPAIR_ATTEMPTS, ROLES,
            } = require('./.github/scripts/delivery-lifecycle');
            const { classifySession } = await import(require('node:url').pathToFileURL(
              require('node:path').resolve('.github/scripts/session-state.mjs')).href);
            const { owner, repo } = context.repo;
            const human = process.env.HUMAN;
            const agent = getOctokit(process.env.AGENT_TOKEN);
            const manual = context.eventName === 'workflow_dispatch';
            const scheduled = context.eventName === 'schedule';
            const pullRequestEvent = context.eventName === 'pull_request_target';
            // A person removing needs:human is the resume signal; bots (including this controller) are not.
            const humanUnpause = pullRequestEvent && context.payload.action === 'unlabeled'
              && context.payload.label?.name === 'needs:human' && context.payload.sender?.type === 'User';
            const resume = manual && String(context.payload.inputs.resume_repairs) === 'true' || humanUnpause;
            const number = Number(process.env.PR_NUMBER);
            if (!Number.isSafeInteger(number) || number < 1) throw new Error('Routing did not provide a valid PR number.');

            const allWorkflows = await github.paginate(github.rest.actions.listRepoWorkflows, { owner, repo, per_page: 100 });
            const findWorkflow = suffix => allWorkflows.find(item => (item.path || '').endsWith(suffix));
            const ciWorkflow = findWorkflow('/ci.yml');
            const acceptanceWorkflow = findWorkflow('/squad-acceptance-recovery.lock.yml');
            const availableReviewers = ROLES.map(role => ({
              role,
              workflow: findWorkflow(`/squad-review-${role.toLowerCase()}.lock.yml`),
              check: `Squad Review / ${role}`,
            }));
            const copilotWorkflow = allWorkflows.find(item => (item.path || '').startsWith('dynamic/copilot-swe-agent'));

            await evaluate(number);

            async function getComments(number) {
              return github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
            }
            async function recoverTracking(pr, issue, issueComments, prComments) {
              const input = recoveryInput(pr, issue, issueComments, owner, repo);
              const key = input?.plan || reviewInputKey(issue.body || '');
              const marker = `<!-- squad-acceptance-recovery:${key} -->`;
              const notice = `<!-- squad-acceptance-recovery-blocked:${key} -->`;
              const request = issueComments.find(comment => isControllerComment(comment, owner)
                && (comment.body || '').startsWith(`${marker}\n`));
              let reason;
              if (!input || !acceptanceWorkflow) {
                reason = 'Automatic recovery needs an approved numbered plan, a cloud-eligible handoff, a missing (not existing) checklist, a flat acceptance list, and the recovery workflow.';
              } else if (request) {
                const requestedPr = request.body.match(/\nPR #([1-9]\d*):/)?.[1];
                const title = `Squad Acceptance Recovery · PR #${requestedPr} · plan ${input.plan}`;
                const run = (await workflowRuns(acceptanceWorkflow, context.payload.repository.default_branch))
                  .find(run => run.display_title === title);
                if (run?.status === 'completed') {
                  reason = `The one-time [checklist recovery run](${run.html_url}) ended without a valid checklist.`;
                } else if (!run && Date.now() - Date.parse(request.created_at) > 30 * 60 * 1000) {
                  reason = 'The one-time checklist recovery request has no visible Actions run.';
                } else {
                  return `Checklist recovery was requested on issue #${issue.number}; no repeat dispatch.`;
                }
              } else {
                const { data: claim } = await agent.rest.issues.createComment({ owner, repo, issue_number: issue.number,
                  body: `${marker}\nPR #${pr.number}: Requesting one issue-only acceptance checklist recovery as \`${input.member}\` under approved plan v${input.version}.\n<!-- squad-acceptance-snapshot:${input.snapshot} -->` });
                try {
                  const first = (await getComments(issue.number)).filter(comment => isControllerComment(comment, owner)
                    && (comment.body || '').startsWith(`${marker}\n`)).sort((a, b) => a.id - b.id)[0];
                  if (first?.id !== claim.id) return 'Another lifecycle evaluation owns this checklist recovery request.';
                  await agent.rest.actions.createWorkflowDispatch({
                    owner, repo, workflow_id: acceptanceWorkflow.id, ref: context.payload.repository.default_branch,
                    inputs: { pr_number: String(pr.number), issue_number: String(issue.number),
                      plan_id: input.plan, delivery_owner: input.member },
                  });
                  return `Requested one issue-only checklist recovery as ${input.member} on #${issue.number}.`;
                } catch (error) {
                  reason = `Checklist recovery dispatch failed (${error.status || 'API error'}); check Actions workflow availability and dispatch permissions.`;
                }
              }
              if (!prComments.some(comment => isControllerComment(comment, owner) && (comment.body || '').startsWith(`${notice}\n`))) {
                await agent.rest.issues.createComment({ owner, repo, issue_number: pr.number,
                  body: `${notice}\n@${human} ${reason} The delivery owner should correct the checklist on #${issue.number}; no coding repair was requested.` });
              }
              return reason;
            }
            async function splitInputs(pr) {
              const split = readSplit(pr.body);
              if (!split || split.reason) return split;
              if (isReviewNone(pr.labels.map(label => label.name))) return { reason: 'A closing scope split cannot use review:none.' };
              try {
                const issue = async number => (await github.rest.issues.get({ owner, repo, issue_number: number })).data;
                const [source, followUp, comments] = await Promise.all([
                  issue(split.source), issue(split.followUp), getComments(split.source),
                ]);
                const plan = latestPlan(comments, owner);
                const reason = validateSplit(split, source, followUp, plan, pr.number);
                if (reason) return { reason };
                return { key: reviewInputKey(JSON.stringify([reviewInputKey(pr.body), pr.base.sha,
                  source.body, followUp.body, plan.plan.comment.id, plan.plan.comment.body])) };
              } catch (error) {
                core.warning(`Could not read scope split issues (${error.status || 'API error'}).`);
                return { reason: 'The scope split could not be verified against live issues and plan.' };
              }
            }
            async function changedFiles(pr) {
              try {
                return await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number, per_page: 100 });
              } catch (error) {
                core.warning(`#${pr.number}: changed-file inventory unavailable (${error.status || 'API error'}).`);
                return [];
              }
            }
            async function linkedScope(pr) {
              const body = removeNonProse(pr.body || '');
              const link = body.match(/^(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|relates to|issue:)\s+#([1-9]\d*)\s*$/gim) || [];
              const versions = [...new Set([...body.matchAll(/\bplan(?: version)? v([1-9]\d*)\b/gi)].map(match => Number(match[1])))];
              if (link.length !== 1 || versions.length !== 1) return null;
              const issueNumber = Number(link[0].match(/#(\d+)/)[1]);
              if (!Number.isSafeInteger(issueNumber)) return null;
              try {
                const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
                if (issue.pull_request || !issue.body) return null;
                const plans = (await getComments(issueNumber)).filter(comment => parsePlan(comment, owner)?.version === versions[0]);
                if (plans.length !== 1) return null;
                return { issue: issueNumber, issueBody: issue.body, planVersion: versions[0], planComment: plans[0].id, planText: plans[0].body };
              } catch (error) {
                core.warning(`#${pr.number}: linked scope unavailable for the bundle (${error.status || 'API error'}); reviewers must retrieve it.`);
                return null;
              }
            }
            async function workflowRuns(workflow, branch) {
              if (!workflow) return [];
              return (await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: workflow.id, branch, per_page: 100,
              })).data.workflow_runs;
            }
            async function setReadiness(pr, sha, decision) {
              const name = 'Squad Merge Readiness';
              const checks = await github.paginate(github.rest.checks.listForRef, {
                owner, repo, ref: sha, check_name: name, per_page: 100,
              });
              const existing = checks.filter(check => check.name === name)
                .sort((a, b) => b.id - a.id)[0];
              const output = {
                title: decision.conclusion === 'success' ? 'Merge readiness passed'
                  : decision.conclusion === 'failure' ? 'Merge readiness blocked' : 'Waiting for merge readiness',
                summary: `${decision.reason}\n\nHead: \`${sha}\`. CI and selected reviewer checks are evaluated on this exact head. GitHub branch protection remains the merge authority.`,
              };
              if (existing && !(existing.status === 'completed' && decision.status !== 'completed')) {
                const { data } = await github.rest.checks.update({
                  owner, repo, check_run_id: existing.id,
                  status: decision.status,
                  ...(decision.status === 'completed' ? { conclusion: decision.conclusion } : {}),
                  output,
                });
                return data;
              }
              const { data } = await github.rest.checks.create({
                owner, repo, name, head_sha: sha, status: decision.status,
                ...(decision.status === 'completed' ? { conclusion: decision.conclusion } : {}),
                output,
              });
              return data;
            }
            async function hasRules(pr) {
              const { data: rules } = await github.request('GET /repos/{owner}/{repo}/rules/branches/{branch}', {
                owner, repo, branch: pr.base.ref,
              });
              return hasRequiredMergeRules(rules);
            }
            async function humanFeedback(number) {
              const feedback = [];
              let after = null;
              do {
                const { repository } = await github.graphql(
                  `query($owner:String!,$repo:String!,$number:Int!,$after:String){
                    repository(owner:$owner,name:$repo){pullRequest(number:$number){
                      reviewThreads(first:100,after:$after){pageInfo{hasNextPage,endCursor}
                        nodes{id isResolved isOutdated comments(first:1){nodes{
                          body url updatedAt authorAssociation author{login __typename}
                        }}}
                      }
                    }}
                  }`, { owner, repo, number, after });
                const connection = repository.pullRequest.reviewThreads;
                for (const thread of connection.nodes) {
                  const root = thread.comments.nodes[0];
                  if (thread.isResolved || thread.isOutdated || !root) continue;
                  feedback.push({
                    isResolved: thread.isResolved, isOutdated: thread.isOutdated,
                    body: root.body || '', url: root.url,
                    author: { login: root.author?.login, type: root.author?.__typename, association: root.authorAssociation },
                  });
                }
                after = connection.pageInfo.hasNextPage ? connection.pageInfo.endCursor : null;
              } while (after);
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner, repo, pull_number: number, per_page: 100,
              });
              return { feedback, reviews };
            }
            async function ensureReady(pr) {
              if (!pr.draft) return;
              await agent.graphql('mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){clientMutationId}}', {
                id: pr.node_id,
              });
            }
            async function pauseMerge(pr) {
              if (pr.auto_merge) {
                await agent.graphql('mutation($id:ID!){disablePullRequestAutoMerge(input:{pullRequestId:$id}){clientMutationId}}', {
                  id: pr.node_id,
                });
              }
            }
            async function evaluate(number) {
              let { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
              if (pr.state !== 'open' || pr.head.repo?.full_name !== `${owner}/${repo}`) {
                return core.info(`#${number}: closed or fork PR; no privileged lifecycle actions.`);
              }
              if (context.eventName === 'issues') {
                const split = readSplit(pr.body);
                if (!split || ![split.source, split.followUp].includes(context.payload.issue?.number)) return;
              }
              const labels = pr.labels.map(label => label.name);
              const cloudPr = pr.head.ref.startsWith('copilot/')
                && !labels.includes('handoff:local');
              if (scheduled && (labels.includes('needs:human') || pr.draft && !cloudPr)) {
                return core.info(`#${number}: paused or local draft; no scheduled lifecycle actions.`);
              }
              const sessions = cloudPr ? await workflowRuns(copilotWorkflow, pr.head.ref) : [];
              const session = cloudPr ? classifySession(sessions) : { state: 'ok', run: null };
              if (scheduled && cloudPr && ['active', 'none'].includes(session.state)) {
                return core.info(`#${number}: cloud session is ${session.state}; no scheduled lifecycle actions.`);
              }
              // Invalidate any previous success before doing asynchronous reads.
              // Native auto-merge must not retain an old bypass generation.
              await setReadiness(pr, pr.head.sha, {
                status: 'in_progress', reason: 'Re-evaluating live PR labels, checks, and human feedback.',
              });
              const actionLabel = context.payload.label?.name;
              if (pullRequestEvent && (context.payload.action === 'synchronize'
                  || ['labeled', 'unlabeled'].includes(context.payload.action)
                    && ['review:none', 'needs:human', 'handoff:local'].includes(actionLabel))) {
                await pauseMerge(pr);
              }
              if (pullRequestEvent && ['labeled', 'unlabeled'].includes(context.payload.action)
                  && actionLabel === 'review:none') {
                const actor = context.payload.sender.login;
                const permission = actor === owner ? 'admin'
                  : (await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username: actor })).data.permission;
                if (!isEligiblePermission(permission)) {
                  if (context.payload.action === 'labeled') {
                    await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: 'review:none' });
                  } else {
                    await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: ['review:none'] });
                  }
                  return core.info(`#${number}: ignored review:none action by ineligible actor @${actor}.`);
                }
              }
              const sha = pr.head.sha;
              const timeline = await github.paginate('GET /repos/{owner}/{repo}/issues/{issue_number}/timeline', {
                owner, repo, issue_number: number, per_page: 100,
              });
              const removedAt = reviewNoneRemovedAt(timeline);
              const forceFreshReviews = pullRequestEvent
                && (context.payload.action === 'synchronize'
                  || context.payload.action === 'unlabeled' && actionLabel === 'review:none');
              const reviewEventAt = context.payload.action === 'unlabeled' && actionLabel === 'review:none'
                ? (removedAt || new Date().toISOString())
                : context.payload.pull_request?.updated_at;
              let comments = await getComments(number);

              // A new cloud session is not ready until the newest Copilot workflow
              // run succeeds. Native Watch and fix remains the CI/conflict owner.
              if (resume) {
                const actor = context.payload.sender.login;
                const permission = actor === owner ? 'admin'
                  : (await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username: actor })).data.permission;
                if (!isEligiblePermission(permission)) throw new Error('Repair resume requires repository write permission.');
                if (session.state === 'active') {
                  await pauseMerge(pr);
                  await setReadiness(pr, sha, { status: 'in_progress', reason: 'Finish the active cloud session before resuming repairs.' });
                  return;
                }
                const marker = `<!-- squad-repair-resume:${context.runId} -->`;
                if (!comments.some(comment => isControllerComment(comment, owner) && (comment.body || '').includes(marker))) {
                  await agent.rest.issues.createComment({ owner, repo, issue_number: number,
                    body: `${marker}\n@${actor} resumed repairs after inspecting the pause. Previous attempts remain in the audit history; a new bounded repair episode begins. Scope, CI, and human review requirements are unchanged.` });
                  if (pr.labels.some(label => label.name === 'needs:human')) {
                    await agent.rest.issues.removeLabel({ owner, repo, issue_number: number, name: 'needs:human' });
                  }
                }
                comments = await getComments(number);
              }
              if (cloudPr && session.state === 'ok' && pr.draft) await ensureReady(pr);
              else if (cloudPr && session.state !== 'ok') {
                const marker = comments.some(comment => isControllerComment(comment, owner)
                  && (comment.body || '').includes('<!-- squad-pr-lifecycle:session-wait -->'));
                if (pr.auto_merge) await pauseMerge(pr);
                if (!marker && session.state === 'interrupted') {
                  await agent.rest.issues.createComment({ owner, repo, issue_number: number,
                    body: `<!-- squad-pr-lifecycle:session-wait -->\n🙋 @${human} The latest cloud implementation session did not complete successfully. Review its Actions run and use the manual recovery entry point; no review or merge readiness is inferred.` });
                }
              }
              ({ data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number }));
              if (pr.head.sha !== sha) {
                await pauseMerge(pr);
                return core.info(`#${number}: head changed; wait for its lifecycle event.`);
              }
              const nowLabels = pr.labels.map(label => label.name);
              if (nowLabels.includes('needs:human')) {
                await pauseMerge(pr);
                const pending = await setReadiness(pr, sha, readiness({
                  draft: false, needsHuman: true, sessionOk: true,
                  ci: false, reviewsOk: false, humanBlocks: false, rulesOk: false,
                }));
                return core.info(`#${number}: stopped by needs:human; readiness ${pending.conclusion || pending.status}.`);
              }
              if (cloudPr && session.state !== 'ok') {
                await pauseMerge(pr);
                await setReadiness(pr, sha, {
                  status: 'in_progress', reason: 'Waiting for a successful cloud session before metadata repair or review dispatch.',
                });
                return;
              }
              const allChecks = await github.paginate(github.rest.checks.listForRef, {
                owner, repo, ref: sha, per_page: 100,
              });
              const ci = currentHeadCheck(allChecks, 'ci', sha);
              const ciOk = ci?.status === 'completed' && ci.conclusion === 'success';
              const ciRuns = ciWorkflow ? await workflowRuns(ciWorkflow, pr.head.ref) : [];
              const ciActive = ciRuns.some(item => item.status !== 'completed');
              let scheduledBlocker;
              if (scheduled && !pr.draft) {
                const blockers = [];
                if (pr.mergeable === false) blockers.push({
                  key: `conflict:${sha}:${pr.base.sha}`,
                  detail: 'GitHub reports a merge conflict with the target branch.',
                });
                if (!ciActive && ci?.status === 'completed' && ['failure', 'timed_out'].includes(ci.conclusion)) blockers.push({
                  key: `ci:${sha}`,
                  detail: `The current-head \`ci\` check ${ci.conclusion === 'failure' ? 'failed' : 'timed out'}.`,
                });
                if (blockers.length) {
                  const unseen = blockers.filter(({ key }) => !comments.some(comment => isControllerComment(comment, owner)
                    && (comment.body || '').includes(`<!-- squad-scheduled-blocker:${key} -->`)));
                  const route = items => {
                    if (!cloudPr) return 'The designated local delivery owner should inspect and repair the branch.';
                    const instructions = [];
                    if (items.some(({ key }) => key.startsWith('conflict:'))) instructions.push(
                      'If the PR is still conflicting and you are taking over from **Watch and fix**, turn off its conflict repair first. If no repair is already running, post this as a new PR comment:',
                      '```\n@copilot Resolve the merge conflicts with the target branch on this PR. Keep the approved scope, push to this PR branch, and do not merge the PR.\n```',
                    );
                    if (items.some(({ key }) => key.startsWith('ci:'))) instructions.push(
                      'For CI, check whether **Watch and fix** is enabled for failed workflows and whether it is making progress.',
                    );
                    return instructions.join('\n\n');
                  };
                  if (unseen.length) await agent.rest.issues.createComment({ owner, repo, issue_number: number,
                    body: `${unseen.map(({ key }) => `<!-- squad-scheduled-blocker:${key} -->`).join('\n')}\n@${human} ${unseen.map(({ detail }) => detail).join(' ')}\n\n${route(unseen)}\n\nThe hourly fallback did not start a repair agent.` });
                  scheduledBlocker = `${blockers.map(({ detail }) => detail).join(' ')}\n\nSee the hourly blocker notice for repair instructions.`;
                }
              }
              if (!scheduledBlocker && (!ci || ci.conclusion === 'action_required') && cloudPr
                  && session.state === 'ok' && !ciActive && ciWorkflow) {
                await agent.rest.actions.createWorkflowDispatch({
                  owner, repo, workflow_id: ciWorkflow.id, ref: pr.head.ref,
                });
                core.info(`#${number}: dispatched initial CI on the cloud PR branch.`);
              }

              const repairedBody = repairGeneratedClosingReferences(pr.body, { createdAt: pr.created_at });
              if (repairedBody !== pr.body && (!cloudPr || session.state === 'ok')) {
                await pauseMerge(pr);
                const live = await github.rest.pulls.get({ owner, repo, pull_number: number });
                if (live.data.state !== 'open' || live.data.head.sha !== sha || live.data.body !== pr.body
                    || live.data.labels.some(label => label.name === 'needs:human')) {
                  await pauseMerge(live.data);
                  return core.info(`#${number}: metadata changed before repair; re-evaluate without overwriting it.`);
                }
                await agent.rest.pulls.update({
                  owner, repo, pull_number: number, body: repairedBody,
                });
                ({ data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number }));
                if (pr.head.sha !== sha || pr.body !== repairedBody || !evaluateCompletion(pr.body, { createdAt: pr.created_at }).ok) {
                  throw new Error('Completion repair could not be verified against the live description.');
                }
                if (pr.state !== 'open' || ['needs:human', 'handoff:local', 'review:none'].some(label =>
                  pr.labels.some(item => item.name === label) !== nowLabels.includes(label))) {
                  return core.info(`#${number}: lifecycle ownership or pause changed during metadata repair; wait for its event.`);
                }
                core.info(`#${number}: replaced generated closing references with non-closing references; issue scope remains partial.`);
              }
              const split = await splitInputs(pr);
              if (split?.reason) {
                await pauseMerge(pr);
                const reason = `Delivery owner: resolve the scope-split record or route the specific decision to its owner:\n\n- ${split.reason}`;
                const marker = `<!-- squad-completion-blocked:${reviewInputKey(pr.body || '')} -->`;
                if (!comments.some(comment => isControllerComment(comment, owner) && (comment.body || '').includes(marker))) {
                  await agent.rest.issues.createComment({ owner, repo, issue_number: number,
                    body: `${marker}\n${reason}\n\nNo coding session was requested and no repair attempt was consumed. Correct the linked records, then re-evaluate.` });
                }
                await setReadiness(pr, sha, { status: 'completed', conclusion: 'failure', reason });
                return;
              }
              const inputKey = split?.key || reviewInputKey(pr.body || '');
              // DevOps run metadata otherwise names the default-branch SHA, not the reviewed PR head.
              const reviewerInputKey = role => role === 'DevOps' ? reviewInputKey(`${inputKey}\n${sha}`) : inputKey;
              if (scheduledBlocker) {
                await setReadiness(pr, sha, { status: 'in_progress', reason: scheduledBlocker });
                return;
              }
              const humanData = await humanFeedback(number);
              const priorRejection = comments.filter(comment => isControllerComment(comment, owner)
                && /^<!-- squad-independent-revision:[a-f0-9]{40}:[a-f0-9]{64} -->/m.test(comment.body || ''))
                .sort((a, b) => b.id - a.id)[0];
              const revisionAdmitted = (candidate, reviews) => !priorRejection || (
                !priorRejection.body.startsWith(`<!-- squad-independent-revision:${candidate.head.sha}:`)
                && !isReviewNone(candidate.labels.map(label => label.name))
                && reviews.some(review => review.user?.login === owner && review.user?.type === 'User'
                  && review.state === 'COMMENTED' && review.commit_id === candidate.head.sha
                  && (review.body || '').split(/\r?\n/).some(line =>
                    new RegExp(`^Independent revision: ${priorRejection.id} by [A-Za-z0-9][A-Za-z0-9._/-]*$`).test(line)))
              );
              const enforceRouting = !split && process.env.REVIEW_ROUTING === 'enforce';
              const shouldReview = !pr.draft && !isReviewNone(nowLabels) && (!cloudPr || session.state === 'ok');
              const classifyReviews = (candidate, files, reviews) => routeReviews({
                labels: candidate.labels.map(label => label.name), changedFiles: candidate.changed_files,
                files, reviews, owner: human, sha: candidate.head.sha, baseSha: candidate.base.sha,
                inputKey: reviewInputKey(candidate.body || ''),
              });
              const files = shouldReview ? await changedFiles(pr) : [];
              const routing = shouldReview ? classifyReviews(pr, files, humanData.reviews) : null;
              if (routing) core.info(`#${number}: reviewer routing (${enforceRouting ? 'enforce' : 'observe'}) ${JSON.stringify({
                selected: routing.roles, reasons: routing.reasons, omitted: routing.omitted, needsAttention: !!routing.blocked,
              })}`);
              const reviewers = enforceRouting
                ? availableReviewers.filter(item => routing?.roles.includes(item.role)) : availableReviewers;
              const reviewRuns = new Map();
              const latestReviewChecks = new Map();
              if (shouldReview) {
                let evidence;
                for (const item of reviewers) {
                  const check = currentHeadCheck(allChecks, item.check, sha);
                  const runs = await workflowRuns(item.workflow, context.payload.repository.default_branch);
                  const prRuns = reviewRunsForPr(runs, item.role, number, reviewerInputKey(item.role));
                  const result = prRuns[0] || null;
                  reviewRuns.set(item.role, result);
                  latestReviewChecks.set(item.role, check);
                  const fresh = reviewResultIsFresh({ check, run: result, sha, removedAt });
                  const missingCheck = item.role === 'DevOps' && !fresh
                    && result?.status === 'completed' && result.conclusion === 'success'
                    && (!removedAt || Date.parse(result.created_at) >= Date.parse(removedAt));
                  const reviewProblem = missingCheck
                    ? `finished without a matching ${item.check} check on ${sha.slice(0, 7)}`
                    : `could not complete (${result?.conclusion})`;
                  const failureMarker = `<!-- squad-review-run-failed:${result?.id}:${result?.run_attempt || 1} -->`;
                  const retryPrefix = `<!-- squad-review-retry:${item.role}:${sha}:${inputKey}:`;
                  const retry = comments.find(comment => isControllerComment(comment, owner)
                    && (comment.body || '').startsWith(retryPrefix));
                  if (!fresh && prRuns.length && result.status === 'completed'
                      && (missingCheck || ['timed_out', 'startup_failure'].includes(result.conclusion)) && !forceFreshReviews
                      && !manual && item.workflow && !retry) {
                    await pauseMerge(pr);
                    await setReadiness(pr, sha, { status: 'in_progress', reason: `Retrying ${item.role} review once: it ${reviewProblem}.` });
                    await agent.rest.issues.createComment({ owner, repo, issue_number: number,
                      body: `${retryPrefix}${result.id} -->\nRetrying ${item.role} review once: it ${reviewProblem}. No code repair was attempted.` });
                    evidence ??= reviewEvidence({ pr, files, ci, scope: await linkedScope(pr) });
                    await agent.rest.actions.createWorkflowDispatch({
                      owner, repo, workflow_id: item.workflow.id, ref: context.payload.repository.default_branch,
                      inputs: { pr_number: String(number), review_input: reviewerInputKey(item.role), review_evidence: evidence },
                    });
                    return;
                  }
                  if (!fresh && !manual && !forceFreshReviews && retry?.body.startsWith(`${retryPrefix}${result?.id} -->`)) {
                    return core.info(`#${number}: waiting for the admitted ${item.role} review retry.`);
                  }
                  if (!fresh && result?.status === 'completed'
                      && (missingCheck || ['failure', 'timed_out', 'startup_failure', 'action_required'].includes(result.conclusion))
                      && !forceFreshReviews && !manual
                      && !comments.some(comment => isControllerComment(comment, owner)
                        && (comment.body || '').includes(failureMarker))) {
                    await agent.rest.issues.addLabels({ owner, repo, issue_number: number, labels: ['needs:human'] });
                    await agent.rest.issues.createComment({ owner, repo, issue_number: number,
                      body: `${failureMarker}\n🙋 @${human} ${item.role} review ${reviewProblem}. Inspect ${result.html_url || 'its Actions run'}, fix the review workflow or approval problem, then remove needs:human and manually re-evaluate. No automatic reviewer retry loop was started.` });
                    await setReadiness(pr, sha, {
                      status: 'completed', conclusion: 'failure', reason: missingCheck
                        ? `${item.role} review ${reviewProblem}.` : `${item.role} review workflow requires attention.`,
                    });
                    await pauseMerge(pr);
                    return;
                  }
                  if (reviewDispatchNeeded({
                    fresh, runs: prRuns, forceFresh: forceFreshReviews,
                    eventAt: reviewEventAt,
                  }) && item.workflow) {
                    evidence ??= reviewEvidence({
                      pr, files, ci: currentHeadCheck(allChecks, 'ci', sha), scope: await linkedScope(pr),
                    });
                    await agent.rest.actions.createWorkflowDispatch({
                      owner, repo, workflow_id: item.workflow.id,
                      ref: context.payload.repository.default_branch,
                      inputs: { pr_number: String(number), review_input: reviewerInputKey(item.role), review_evidence: evidence },
                    });
                    core.info(`#${number}: dispatched ${item.role} review for ${sha.slice(0, 7)}.`);
                  }
                }
              }
              // A role removed from routing must not make a current-head failure disappear.
              const excludedFailure = checks => enforceRouting && shouldReview && availableReviewers.find(item =>
                !reviewers.includes(item) && currentHeadCheck(checks, item.check, sha)?.conclusion === 'failure');
              const uncoveredFailure = excludedFailure(allChecks);
              if (enforceRouting && (routing?.blocked || uncoveredFailure)) {
                await pauseMerge(pr);
                await setReadiness(pr, sha, { status: 'completed', conclusion: 'failure',
                  reason: routing?.blocked || `${uncoveredFailure.role} has a blocking check on this head. Resolve it or ask the owner to request that specialist again.`,
                });
                return;
              }
              const blockedByHuman = hasHumanBlocks({
                reviews: humanData.reviews, threads: humanData.feedback, owner,
              });
              const specialistFailures = reviewFailures(allChecks, sha, nowLabels, reviewRuns, removedAt,
                isReviewNone(nowLabels) ? [] : reviewers.map(item => item.role));
              const actionableHuman = humanBlockingFeedback({
                reviews: humanData.reviews, threads: humanData.feedback, owner,
              });
              const latestReviewsOk = isReviewNone(nowLabels) || reviewers.every(item => {
                const check = latestReviewChecks.get(item.role);
                const result = reviewRuns.get(item.role);
                return reviewResultIsFresh({ check, run: result, sha, removedAt })
                  && check.conclusion === 'success' && result.status === 'completed' && result.conclusion === 'success'
                  && (!split || splitReviewPasses(item.role, check));
              });
              const rulesOk = await hasRules(pr);
              const decision = readiness({
                draft: pr.draft,
                needsHuman: nowLabels.includes('needs:human'),
                sessionOk: session.state === 'ok',
                ci: ciOk,
                reviewsOk: latestReviewsOk && revisionAdmitted(pr, humanData.reviews),
                humanBlocks: blockedByHuman,
                rulesOk,
              });
              await setReadiness(pr, sha, decision.conclusion === 'success'
                ? { status: 'in_progress', reason: 'Confirming live merge-readiness inputs.' } : decision);

              const sessionRuns = sessions;
              const episodeComments = repairEpisode(comments, owner);
              const latestFix = episodeComments.map(comment => {
                const request = parseFixRequest(comment, owner);
                return request ? {
                  sha: request.headSha, mode: request.mode,
                  created: Date.parse(comment.created_at), comment,
                } : null;
              }).filter(Boolean).sort((a, b) => a.created - b.created).at(-1);
              const feedback = [
                ...specialistFailures.filter(({ check }) => !/^Repair route: (human|metadata)\s*$/im.test(check.output?.summary || '')).map(({ role, check }) => ({
                  kind: `${role} review`, body: `${check.output?.title || 'Blocking review findings'}\n${check.output?.summary || ''}`,
                  url: check.html_url,
                })),
                ...actionableHuman.map(item => ({ kind: 'trusted human review feedback', body: item.body, url: item.url })),
              ];
              const details = feedback.map(item => `### ${item.kind}\n${item.url ? `${item.url}\n` : ''}${item.body}`).join('\n\n');
              const independent = specialistFailures.filter(({ check }) => /^Revision: independent\s*$/m.test(check.output?.summary || ''));
              if (independent.length) {
                await pauseMerge(pr);
                const marker = `<!-- squad-independent-revision:${sha}:${inputKey} -->`;
                if (!comments.some(comment => isControllerComment(comment, owner) && (comment.body || '').startsWith(marker))) {
                  await agent.rest.issues.createComment({ owner, repo, issue_number: number,
                    body: `${marker}\nFormal rejection: the delivery coordinator must assign a different eligible agent, excluding all authors rejected on this artifact. The original owner must not revise or advise. Ensure no cloud repair is still active and disable Watch and fix before local takeover. Escalate only if no eligible owner exists.\n\n${independent.map(({ role, check }) => `${role}: ${check.html_url || ''}\n${check.output?.summary || ''}`).join('\n\n')}` });
                }
              } else if (priorRejection && !revisionAdmitted(pr, humanData.reviews)) {
                await pauseMerge(pr);
                await setReadiness(pr, sha, { status: 'completed', conclusion: 'failure',
                  reason: `Independent revision pending for rejection comment ${priorRejection.id}. The coordinator must verify a different agent revised this artifact; then the repository owner records the revision as a current-head review comment. Review opt-out is unavailable.` });
              } else if (feedback.length && !nowLabels.includes('needs:human')) {
                const activeCloud = cloudPr && session.state === 'active';
                const outcomes = repairOutcomes(episodeComments, sessionRuns, owner);
                const blockedOutcome = outcomes.find(item => item.request.id === latestFix?.comment.id && item.outcome !== 'attempted');
                const requestOutstanding = cloudPr && outstandingFixRequest(episodeComments, sessionRuns, true, owner);
                const localAlreadyAsked = !cloudPr && latestFix?.sha === sha && latestFix?.mode === 'local';
                const attempts = actualRepairAttempts(episodeComments, sessionRuns, sha, cloudPr, owner);
                const missingOutcome = !activeCloud && requestOutstanding && latestFix
                    && sessionRuns.some(run => run.status === 'completed'
                      && ['success', 'failure'].includes(run.conclusion)
                      && Date.parse(run.run_started_at || run.created_at) >= latestFix.created);
                if (blockedOutcome || missingOutcome) {
                  const recoveryMarker = `<!-- squad-repair-recheck:${latestFix.comment.id} -->`;
                  const recoveryAdmitted = comments.some(comment => isControllerComment(comment, owner)
                    && (comment.body || '').startsWith(recoveryMarker));
                  if (missingOutcome && recoveryAdmitted && [...reviewRuns.values()].some(run => run && run.status !== 'completed')) {
                    return core.info(`#${number}: waiting for the repair outcome recheck.`);
                  }
                  const recheck = !actionableHuman.length && !blockedOutcome
                    && specialistFailures.filter(({ role }) => reviewers.some(item => item.role === role && item.workflow));
                  if (recheck?.length && !recoveryAdmitted) {
                    await pauseMerge(pr);
                    await agent.rest.issues.createComment({ owner, repo, issue_number: number,
                      body: `${recoveryMarker}\nA later coding run did not report an attributable outcome. Rechecking the live artifact once before escalating; no coding request was sent.` });
                    const evidence = reviewEvidence({ pr, files, ci, scope: await linkedScope(pr) });
                    for (const { role } of recheck) {
                      await agent.rest.actions.createWorkflowDispatch({
                        owner, repo, workflow_id: reviewers.find(item => item.role === role).workflow.id,
                        ref: context.payload.repository.default_branch,
                        inputs: { pr_number: String(number), review_input: reviewerInputKey(role), review_evidence: evidence },
                      });
                    }
                    return;
                  }
                  await agent.rest.issues.addLabels({ owner, repo, issue_number: number, labels: ['needs:human'] });
                  await agent.rest.issues.createComment({ owner, repo, issue_number: number,
                    body: `@${human} Review repair needs a capable owner or an attributable outcome, not another identical coding request. ${blockedOutcome ? `Reported outcome: ${blockedOutcome.outcome}. See ${blockedOutcome.comment.html_url || 'the repair outcome comment'}.` : 'A cloud session completed without a matching repair outcome; it was not counted as a fix attempt.'} Resolve the capability/dependency or inspect the session, then **remove the \`needs:human\` label** to resume (this starts a fresh repair episode). No attempt was consumed for this blocker.\n\n${details}` });
                  await pauseMerge(pr);
                } else if (attempts >= MAX_REPAIR_ATTEMPTS) {
                  await agent.rest.issues.addLabels({ owner, repo, issue_number: number, labels: ['needs:human'] });
                  await agent.rest.issues.addAssignees({ owner, repo, issue_number: number, assignees: [human] });
                  await agent.rest.issues.createComment({ owner, repo, issue_number: number,
                    body: `🙋 @${human} **Review fixes remain blocking after ${MAX_REPAIR_ATTEMPTS} actual attempts.** Inspect the attempted fixes and remaining findings, choose the capable repair owner, then **remove the \`needs:human\` label** to resume with a fresh repair episode. Scope changes require approval. CI and trusted human feedback remain required.\n\n${details}` });
                  await pauseMerge(pr);
                } else if (!activeCloud && !requestOutstanding
                    && !localAlreadyAsked && (cloudPr || manual || !latestFix || latestFix.sha !== sha
                      || latestFix.mode !== (cloudPr ? 'cloud' : 'local'))) {
                  const marker = `<!-- squad-review-fix:${sha}:${cloudPr ? 'cloud' : 'local'} -->`;
                  const token = require('node:crypto').randomUUID();
                  const prompt = cloudPr
                    ? `@copilot Fix the actionable blocking implementation feedback below within the approved scope. Do not repair PR metadata in code or expand scope. CI failures and merge conflicts belong to Watch and fix. In the outcome comment list each finding and its fix/test evidence, or reasoned disagreement for the reviewer to decide. Do not resolve a human thread yourself.\n\nAt the end, post a top-level PR comment containing exactly one whole-line outcome marker: <!-- squad-repair-outcome:${token}:RUN_ID:attempted -->, replacing RUN_ID with this Copilot Actions workflow run's numeric ID. Use attempted only after substantive investigation/fix of this request, and describe evidence and any commit. Use capability-blocked or external-blocked instead when tools/permissions or a human dependency prevent the repair; name the missing capability, owner and next action. Never claim an attempt for an inability explanation or unrelated CI work.`
                    : `Delivery owner: address every finding in the local session. Record each fix and verification evidence or reasoned disagreement for the reviewer; unresolved human change requests remain blocking.`;
                  await agent.rest.issues.createComment({ owner, repo, issue_number: number,
                    body: `${marker}\n<!-- squad-repair-request:${token} -->\n${prompt}\n\n${details}` });
                }
              }
              const metadataActions = specialistFailures.filter(({ check }) => /^Repair route: metadata\s*$/im.test(check.output?.summary || ''));
              if (metadataActions.length && !independent.length) {
                const marker = `<!-- squad-metadata-findings:${sha}:${inputKey} -->`;
                if (!comments.some(comment => isControllerComment(comment, owner) && (comment.body || '').startsWith(marker))) {
                  await agent.rest.issues.createComment({ owner, repo, issue_number: number,
                    body: `${marker}\nDelivery owner: correct these records and request re-evaluation. This is not a code repair or human escalation.\n\n${metadataActions.map(({ role, check }) => `${role}: ${check.html_url || ''}\n${check.output?.summary || ''}`).join('\n\n')}` });
                }
              }
              const humanActions = specialistFailures.filter(({ check }) => /^Repair route: human\s*$/im.test(check.output?.summary || ''));
              if (!independent.length && !feedback.length && !metadataActions.length && humanActions.length) {
                await agent.rest.issues.addLabels({ owner, repo, issue_number: number, labels: ['needs:human'] });
                await agent.rest.issues.createComment({ owner, repo, issue_number: number,
                  body: `@${human} The remaining review findings require a metadata/scope decision, external dependency, or complete review input, not a coding attempt. Resolve the specific actions below, then **remove the \`needs:human\` label** to resume. No code-repair attempt was consumed.\n\n${humanActions.map(({ role, check }) => `### ${role}\n${check.html_url || ''}\n${check.output?.summary || ''}`).join('\n\n')}` });
                await pauseMerge(pr);
              }

              if (decision.conclusion === 'success') {
                // Re-read live state immediately before arming auto-merge. The
                // branch rules and GitHub itself remain the merge authority.
                const latestPr = (await github.rest.pulls.get({ owner, repo, pull_number: number })).data;
                const freshSplit = await splitInputs(latestPr);
                const freshHuman = await humanFeedback(number);
                const freshChecks = await github.paginate(github.rest.checks.listForRef, {
                  owner, repo, ref: sha, per_page: 100,
                });
                const freshTimeline = await github.paginate('GET /repos/{owner}/{repo}/issues/{issue_number}/timeline', {
                  owner, repo, issue_number: number, per_page: 100,
                });
                const freshLabels = latestPr.labels.map(label => label.name);
                const freshCi = currentHeadCheck(freshChecks, 'ci', sha);
                const freshRouting = enforceRouting && !isReviewNone(freshLabels) && latestPr.head.sha === sha
                  ? classifyReviews(latestPr, await changedFiles(latestPr), freshHuman.reviews) : null;
                let freshReviewsOk = isReviewNone(freshLabels);
                if (!freshReviewsOk) {
                  freshReviewsOk = true;
                  for (const item of reviewers) {
                    const runs = await workflowRuns(item.workflow, context.payload.repository.default_branch);
                    const result = reviewRunsForPr(runs, item.role, number, reviewerInputKey(item.role))[0];
                    const check = currentHeadCheck(freshChecks, item.check, sha);
                    if (!reviewResultIsFresh({
                      check, run: result, sha, removedAt: reviewNoneRemovedAt(freshTimeline),
                    }) || check.conclusion !== 'success' || split && !splitReviewPasses(item.role, check)) freshReviewsOk = false;
                  }
                }
                if (latestPr.state !== 'open' || latestPr.head.sha !== sha
                    || latestPr.draft || freshLabels.includes('needs:human')
                    || isReviewNone(freshLabels) !== isReviewNone(nowLabels)
                    || reviewNoneRemovedAt(freshTimeline) !== removedAt
                    || freshLabels.includes('handoff:local') !== nowLabels.includes('handoff:local')
                    || freshSplit?.reason || (freshSplit?.key || reviewInputKey(latestPr.body || '')) !== inputKey
                    || freshCi?.status !== 'completed' || freshCi.conclusion !== 'success'
                    || freshRouting && (freshRouting.blocked || excludedFailure(freshChecks)
                      || latestPr.base.sha !== pr.base.sha
                      || freshRouting.roles.join(',') !== routing?.roles.join(','))
                    || !freshReviewsOk
                    || !revisionAdmitted(latestPr, freshHuman.reviews)
                    || hasHumanBlocks({ reviews: freshHuman.reviews, threads: freshHuman.feedback, owner })
                    || (cloudPr && classifySession(await workflowRuns(copilotWorkflow, pr.head.ref)).state !== 'ok')) {
                  await setReadiness(latestPr, sha, {
                    status: 'in_progress', reason: 'Live inputs changed; re-evaluate this PR before merging.',
                  });
                  await pauseMerge(latestPr);
                  core.info(`#${number}: state changed during final merge-readiness check.`);
                  return;
                }
                const finalRulesOk = await hasRules(latestPr);
                if (!finalRulesOk) {
                  await setReadiness(latestPr, sha, decision);
                  await pauseMerge(latestPr);
                  return core.info(`#${number}: readiness bootstrapped; required-check migration is still an owner action.`);
                }
                // GitHub rejects enabling auto-merge on an already clean PR.
                // Keep our required check pending until native auto-merge is armed.
                if (!latestPr.auto_merge) {
                  await agent.graphql('mutation($id:ID!,$head:GitObjectID!){enablePullRequestAutoMerge(input:{pullRequestId:$id,mergeMethod:SQUASH,expectedHeadOid:$head}){clientMutationId}}', {
                    id: latestPr.node_id, head: sha,
                  });
                }
                await setReadiness(latestPr, sha, decision);
                if (!latestPr.auto_merge) {
                  await agent.rest.issues.createComment({ owner, repo, issue_number: number,
                    body: `✅ Squad Merge Readiness passed for \`${sha.slice(0, 7)}\`. GitHub squash auto-merge is enabled and branch protections determine whether the PR can merge.` });
                }
              } else if (decision.conclusion !== 'success' || !rulesOk) {
                await pauseMerge(pr);
              }
              core.info(`#${number}: ${decision.status}/${decision.conclusion || 'pending'} — ${decision.reason}`);
            }
      - name: Escalate lifecycle automation failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HUMAN: cedricmendelin
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const human = process.env.HUMAN;
            const title = 'Squad PR Lifecycle automation failing';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'needs:human', per_page: 100,
            });
            const existing = open.find(issue => issue.title === title);
            const body = `@${human} the default-branch PR lifecycle controller failed: ${runUrl}\n\nInspect the failed step, repair the workflow/configuration, then close this issue. No direct merge or protection bypass was attempted.`;
            if (existing) await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            else await github.rest.issues.create({ owner, repo, title, body, labels: ['needs:human'], assignees: [human] });
